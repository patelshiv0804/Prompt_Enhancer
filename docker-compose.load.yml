services:
  k6:
    image: grafana/k6:0.54.0
    container_name: promptiq-k6
    env_file:
      - .env.loadtest
    environment:
      LOAD_BASE_URL: ${LOAD_BASE_URL:-http://web:8000}
      LOAD_EMAIL: ${LOAD_EMAIL:-loadtest@example.com}
      LOAD_PASSWORD: ${LOAD_PASSWORD:-LoadTestPassword123!}
      LOAD_DURATION: ${LOAD_DURATION:-1m}
      LOAD_VUS: ${LOAD_VUS:-5}
      LOAD_INCLUDE_LLM: ${LOAD_INCLUDE_LLM:-false}
      LOAD_PROMPT: ${LOAD_PROMPT:-Write a concise product announcement for an AI prompt optimization app.}
    volumes:
      - ./tests/load:/scripts:ro
    command: run /scripts/promptiq-load.js
    depends_on:
      web:
        condition: service_started
    networks:
      - promptiq-network
