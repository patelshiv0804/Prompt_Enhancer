[pytest]
testpaths = tests

# asyncio_mode = auto means every `async def test_*` is collected without an
# explicit @pytest.mark.asyncio decorator.
asyncio_mode = auto

# Both loop scopes are pinned to `session` on purpose. The database engine is
# session-scoped, and asyncpg connections are bound to the loop that created
# them — with the default per-function loop, any session-scoped connection would
# fail with "attached to a different loop" on the second test.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Coverage is intentionally NOT in addopts: it would slow the fast unit tier and
# report misleading numbers when only a subset is selected. Pass it explicitly:
#   pytest tests/integration --cov=app --cov-report=term-missing
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    unit: no database, no network, no filesystem. Milliseconds.
    integration: hits the real test database and the ASGI app.
    contract: schema/fuzz tests driven by the OpenAPI document.
    slow: loads the real embedding model or otherwise takes seconds.

filterwarnings =
    default
    # SQLModel/SQLAlchemy emit these through no fault of the test suite.
    ignore::DeprecationWarning:sqlmodel.*
    ignore::DeprecationWarning:pydantic.*
