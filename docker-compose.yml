services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: promptiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - promptiq-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promptiq-web
    # NOTE: --reload and the ".:/app" bind-mount below are for local development
    # only. Production should drop both (use a baked image, no --reload) — VULN-016.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      - TOP_K_RESULTS=${TOP_K_RESULTS:-5}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.65}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@promptiq.com}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Allow the browser extension's chrome-extension://<id> origin. Pin the
      # exact published origin in production instead of this dev-wide pattern.
      - CORS_ORIGIN_REGEX=${CORS_ORIGIN_REGEX:-chrome-extension://.*}
      # Match the image's baked-in Hugging Face cache location (see Dockerfile).
      - HF_HOME=/opt/hf-cache
    volumes:
      - .:/app
      - uploads:/app/uploads
      # Persist the Hugging Face model cache across restarts. A fresh named
      # volume is initialised from the image's baked-in /opt/hf-cache, so the
      # model is present even with HF offline. Recreate it (docker compose
      # down -v) if you rebuild the image with a different model.
      - hfcache:/opt/hf-cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - promptiq-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: promptiq-pgadmin
    environment:
      # Credentials come from the environment; the defaults are dev-only (VULN-018).
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@promptiq.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - promptiq-network

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  hfcache:
    driver: local

networks:
  promptiq-network:
    driver: bridge