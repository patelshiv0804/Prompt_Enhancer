name: Backend Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-unit-secret-key-with-at-least-32-chars
      ALGORITHM: HS256
      MISTRAL_API_KEY: ci-dummy-key
      DATABASE_URL: postgresql+asyncpg://unit:unit@127.0.0.1:1/unit_test
      TEST_DATABASE_URL: postgresql+asyncpg://unit:unit@127.0.0.1:1/unit_test
      REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r requirements-dev.txt

      - name: Run DB-free unit tier
        run: pytest tests/unit -m unit

  integration-contract:
    name: Integration And Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: promptiq_user
          POSTGRES_PASSWORD: promptiq_pass
          POSTGRES_DB: promptiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptiq_user -d promptiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-integration-secret-key-with-at-least-32-chars
      ALGORITHM: HS256
      MISTRAL_API_KEY: ci-dummy-key
      DATABASE_URL: postgresql+asyncpg://promptiq_user:promptiq_pass@localhost:5432/promptiq_test
      TEST_DATABASE_URL: postgresql+asyncpg://promptiq_user:promptiq_pass@localhost:5432/promptiq_test
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration and contract tiers
        run: pytest tests/test_harness.py tests/integration tests/contract
