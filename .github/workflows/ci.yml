name: PromptIQ CI Workflow

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: kartik
          POSTGRES_PASSWORD: kartik123
          POSTGRES_DB: promptiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://kartik:kartik123@localhost:5432/promptiq
        run: |
          # If migrations need to run before tests, uncomment:
          # python -m alembic upgrade head

      - name: Run Test Suite (pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://kartik:kartik123@localhost:5432/promptiq
          PYTHONPATH: .
        run: |
          python -m pytest tests/
